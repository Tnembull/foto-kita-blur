<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foto Kita Blur ✌️ | Real-time Gesture Blur</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <div class="logo-group">
      <h1>Foto Kita Blur ✌️</h1>
    </div>
    <div id="status-badge" class="status-badge">
      <span class="dot"></span>
      <span id="status-text">Mencari Gestur...</span>
    </div>
  </header>

  <main>
    <div class="viewport-container">
      <video id="webcam-video" playsinline></video>
      <canvas id="output-canvas"></canvas>
    </div>

    <div class="controls-dock">
      <div class="control-item">
        <label for="blur-slider">Kekuatan Blur (<span id="blur-val">18</span>px)</label>
        <input type="range" id="blur-slider" min="5" max="40" value="18" />
      </div>

      <div class="control-item">
        <label for="audio-mode-select">Pilih Musik / Audio</label>
        <select id="audio-mode-select">
          <option value="song">🎵 Sal Priadi - Foto Kita Blur</option>
          <option value="synth">🔔 Sound Effect Synth</option>
          <option value="upload">📁 Upload MP3 Sendiri...</option>
          <option value="muted">🔇 Mute Audio</option>
        </select>
        <input type="file" id="audio-file-input" accept="audio/*" style="display: none;" />
      </div>

      <div class="control-item">
        <label for="audio-start-input">Mulai Detik Lirik (<span id="audio-start-val">42</span>s)</label>
        <input type="range" id="audio-start-input" min="0" max="180" value="42" />
      </div>

      <div class="control-item">
        <label for="camera-select">Pilih Kamera</label>
        <select id="camera-select"></select>
      </div>

      <div class="control-item">
        <label>&nbsp;</label>
        <button id="capture-btn" class="btn-primary">
          📸 Ambil Foto
        </button>
      </div>
    </div>
  </main>

  <div id="preview-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Foto Kita Blur</h2>
      <img id="captured-img" alt="Captured Photo" />
      <div class="modal-actions">
        <button id="close-modal-btn" class="btn-secondary">Tutup</button>
        <a id="download-btn" class="btn-primary" download="foto-kita-blur.png">Download Foto</a>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
